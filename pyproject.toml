[build-system]
# setuptools>=77 is the first release that accepts an SPDX `license` string and
# `license-files` (PEP 639), so it is the floor. `wheel` is not listed: setuptools
# has built wheels itself since 70.1.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "causalmesh"
# The one place the version is written is `src/causalmesh/__init__.py`
# (`__version__`); setuptools reads it from there without importing the package.
dynamic = ["version"]
description = "An experimental platform separating information from enforcement in distributed LLM coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sagexd08" }]
keywords = [
    "multi-agent",
    "coordination",
    "llm-agents",
    "policy",
    "audit",
    "evidence",
    "reproducible-research",
    "experimental-platform",
]
# Pre-Alpha on purpose: nothing here has been run against a hosted model or in
# production (AGENTS.md). Do not raise this without evidence that changed.
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]

# Runtime core is deliberately light (spec §7). The coordination substrate —
# relay, events, claims, hooks, storage, verifier — leans on the standard
# library; `cryptography` supplies Ed25519 and PyYAML parses configuration.
#
# The floors below are deliberate, and each was measured (2026-09-30):
#
# - `cryptography>=50.0`: every release below it carries an advisory in
#   pip-audit's data (14 at 41.0.0 alone). This is the library that signs the
#   chain, so its floor is the one that matters most.
# - `click>=8.3.3`: typer's own dependency, declared here because the CLI
#   depends on its behaviour and 8.3.2 and below carry PYSEC-2026-2132.
# - `typer>=0.16`: the CLI annotates options as `Path | None`, which 0.12.0 rejects
#   ("Type not yet supported"), and with click 8.3 0.15.4 and below fail too;
#   0.16.0 is the lowest release for which every CLI command runs.
# - `PyYAML>=6.0.2`: 6.0 and 6.0.1 have no wheel for Python 3.13, and 6.0 does
#   not build on 3.12.
# Re-run `pip-audit` against the floors pinned exactly before changing any.
dependencies = [
    "cryptography>=50.0",
    "PyYAML>=6.0.2",
    "typer>=0.16",
    "click>=8.3.3",
    "rich>=13.0",
]

[project.optional-dependencies]
# The analysis stack is heavier than the runtime, and intentionally separate.
# Each package has a floor per Python because the oldest release with a wheel
# differs: numpy 1.26, scipy 1.11.0, pandas 2.0.0, statsmodels 0.14.0 and
# matplotlib 3.8.0 (the previous floors) have no wheel for 3.13, and scipy
# 1.11.0 and pandas 2.0.0 have none for 3.12 either, so `pip install
# causalmesh[analysis]` would have tried to build them from source.
analysis = [
    "numpy>=1.26; python_version < '3.13'",
    "numpy>=2.1; python_version >= '3.13'",
    "scipy>=1.11.2; python_version < '3.13'",
    "scipy>=1.14.1; python_version >= '3.13'",
    "pandas>=2.1.1; python_version < '3.13'",
    "pandas>=2.2.3; python_version >= '3.13'",
    "statsmodels>=0.14; python_version < '3.13'",
    "statsmodels>=0.14.4; python_version >= '3.13'",
    "matplotlib>=3.8; python_version < '3.13'",
    "matplotlib>=3.9.2; python_version >= '3.13'",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.2",
    "pytest-xdist>=3.5",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    # Starlette's TestClient (tests/server) imports `httpx` up to Starlette
    # 1.0 and `httpx2` from 1.7. Which one a clean install needs depends on
    # the Starlette that resolves, so both are declared; without the right
    # one, installing the `server` extra aborts test collection outright.
    "httpx>=0.27",
    "httpx2>=2.0",
    # Pinned rather than floored. Lint and format rules change between
    # minor releases, so an unpinned version means a pull request that
    # changed nothing can fail on a rule that did not exist when it was
    # opened. `pip install -e '.[dev]'` installs these exact versions.
    "ruff==0.9.6",
    "mypy==1.14.1",
    "types-PyYAML>=6.0",
    "bandit[toml]>=1.7",
]
server = [
    # `fastapi>=0.111` allowed starlette 0.37.2, which has 7 advisories (fixed
    # by 1.3.1). The smallest fastapi that admits starlette 1.3.1 is 0.133.0,
    # so that is the honest floor; starlette is named because it is what carries
    # the advisories, and pydantic because 2.0 to 2.3 have one.
    "fastapi>=0.133",
    "starlette>=1.3.1",
    "pydantic>=2.4",
    "uvicorn>=0.29",
]
# Needed for the LangChain adapter and its tests. Not in `server`: a gateway
# does not need it. 1.3.3 is the lowest release with no advisory in pip-audit's
# data (0.3.0 has 13), and the adapter tests pass at exactly that version.
langchain = [
    "langchain-core>=1.3.3",
]

[project.urls]
Homepage = "https://github.com/Sagexd08/CausalMesh"
Repository = "https://github.com/Sagexd08/CausalMesh"
Source = "https://github.com/Sagexd08/CausalMesh"
Issues = "https://github.com/Sagexd08/CausalMesh/issues"
Changelog = "https://github.com/Sagexd08/CausalMesh/blob/main/CHANGELOG.md"
Documentation = "https://github.com/Sagexd08/CausalMesh/tree/main/docs"

[project.scripts]
causalmesh = "causalmesh.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "causalmesh.__version__" }

[tool.setuptools.package-data]
# PEP 561 marker. The package reads no other non-Python file at run time (the
# init and quickstart templates are built in code), so nothing else is listed;
# `tests/unit/test_packaging.py` fails if that stops being true.
causalmesh = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
norecursedirs = ["tests/fixtures", ".git", "node_modules", "*.egg"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "unit: isolated component tests",
    "integration: cross-component tests exercising real paths",
    "property: invariant tests driven by hypothesis",
    "adversarial: attacks that the verifier must detect",
    "failure: fault-injection and recovery tests",
    "reproducibility: same seed and config yield equivalent structure",
    "slow: tests that take more than a few seconds",
]
asyncio_mode = "auto"
timeout = 300

[tool.ruff]
line-length = 100
target-version = "py311"
# Fixtures are experimental material, not project source: they are copied
# into agent workspaces and edited by agents under test. Linting them would
# let tooling silently rewrite the thing being studied — `ruff --fix` did
# exactly that once, stripping `noqa` directives the fixture needs when it
# runs as a standalone repository inside a workspace.
extend-exclude = ["fixtures"]
# Test-support modules (e.g. tests/adversarial/chain_fixtures.py) are imported
# by bare name because pytest puts each test directory on sys.path; listing
# those directories here keeps them classified as first-party.
src = ["src", "tests", "tests/adversarial", "tests/support"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",
    # isinstance(x, (A, B)) is kept over the X | Y form: canonicalization runs
    # it on every value of every event, and the tuple form avoids constructing
    # a union object per call. Deliberate, not an oversight.
    "UP038",
    # Docstrings quote the specification's own notation (mu, nu, lambda,
    # delta) and its section signs. Transliterating them would make the code
    # harder to check against the spec, which is the point of citing it.
    "RUF002",
    # The TUI draws with box and chevron glyphs, and tests assert on the
    # exact characters it renders. RUF001 reads those as typos for ASCII
    # lookalikes; here they are the subject, not a slip.
    "RUF001",
    # `noqa: BLE001` appears on every broad `except` in the CLI and TUI,
    # where reporting a failure is the correct behaviour and crashing is
    # not. BLE001 is not in `select`, so ruff calls those directives unused
    # and offers to delete them. They are documentation: each one states why
    # the broad catch is deliberate, and stripping them would remove the
    # reasoning while leaving the code. Enabling RUF100 here would make
    # `--fix` quietly do that, which it did once already.
    "RUF100",
]

[tool.ruff.lint.isort]
# Keep aliased imports inside the block they belong to. Without this, ruff
# splits `from x import (A as B, C)` into one `from x import` statement per
# aliased name, turning a readable six-name block into four statements from
# the same module. Sorting is worth having; shattering a block to achieve it
# is not.
force-single-line = false
combine-as-imports = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["yaml", "yaml.*"]
ignore_missing_imports = true
