[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "causalmesh"
version = "0.1.0"
description = "An experimental platform separating information from enforcement in distributed LLM coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sagexd08" }]
keywords = [
    "multi-agent",
    "coordination",
    "llm-agents",
    "reproducible-research",
    "experimental-platform",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

# Runtime core is deliberately light (spec §7). The coordination substrate —
# relay, events, claims, hooks, storage, verifier — leans on the standard
# library; `cryptography` supplies Ed25519 and PyYAML parses configuration.
dependencies = [
    "cryptography>=41.0",
    "PyYAML>=6.0",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
# The analysis stack is heavier than the runtime, and intentionally separate.
analysis = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.2",
    "pytest-xdist>=3.5",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
]

[project.urls]
Homepage = "https://github.com/Sagexd08/CausalMesh"
Repository = "https://github.com/Sagexd08/CausalMesh"
Issues = "https://github.com/Sagexd08/CausalMesh/issues"

[project.scripts]
causalmesh = "causalmesh.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "unit: isolated component tests",
    "integration: cross-component tests exercising real paths",
    "property: invariant tests driven by hypothesis",
    "adversarial: attacks that the verifier must detect",
    "failure: fault-injection and recovery tests",
    "reproducibility: same seed and config yield equivalent structure",
    "slow: tests that take more than a few seconds",
]
asyncio_mode = "auto"
timeout = 300

[tool.ruff]
line-length = 100
target-version = "py311"
# Test-support modules (e.g. tests/adversarial/chain_fixtures.py) are imported
# by bare name because pytest puts each test directory on sys.path; listing
# those directories here keeps them classified as first-party.
src = ["src", "tests", "tests/adversarial"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",
    # isinstance(x, (A, B)) is kept over the X | Y form: canonicalization runs
    # it on every value of every event, and the tuple form avoids constructing
    # a union object per call. Deliberate, not an oversight.
    "UP038",
    # Docstrings quote the specification's own notation (mu, nu, lambda,
    # delta) and its section signs. Transliterating them would make the code
    # harder to check against the spec, which is the point of citing it.
    "RUF002",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
