# causalmesh.yaml - what agents working in this repository may do.
#
# Sibling to AGENTS.md, not a replacement. AGENTS.md says what agents should
# do and enforces nothing; this says what they are allowed to do, and the
# gate holds them to it. The project argues that a convention every agent
# reads and no agent is held to is a convention without a substrate, so it
# ships both halves rather than only the readable one.
#
# Check any rule without running an agent or spending anything:
#
#     causalmesh policy show
#     causalmesh policy check --agent docs --kind path --name src/causalmesh/crypto/chain.py
#
# `check` exits 0 when allowed and 1 when refused, and records nothing.
version: 1

roles:
  # The crypto and claims layers are where this project's guarantees live.
  # A change to either invalidates evidence that verifies today, so they are
  # owned rather than open: an agent editing them should be one that was
  # asked to.
  - agent_id: substrate
    archetype: writer
    owns:
      - src/causalmesh/crypto/
      - src/causalmesh/claims/
      - src/causalmesh/events/
      - src/causalmesh/verifier/

  - agent_id: policy
    archetype: writer
    owns:
      - src/causalmesh/policy/
      - src/causalmesh/cli/commands_policy.py

  - agent_id: interface
    archetype: writer
    owns:
      - src/causalmesh/tui/
      - src/causalmesh/cli/

  - agent_id: web
    archetype: writer
    owns:
      - frontend/

  - agent_id: docs
    archetype: writer
    owns:
      - docs/
      - README.md
      - CONTRIBUTING.md
      - AGENTS.md

  # Reads everything, owns nothing. The archetype exists so a review agent
  # can be pointed at the repository without any path being writable by it.
  - agent_id: reviewer
    archetype: checker
    owns: []

policy:
  # C3 is the enforcing arm. The others record what C3 would have done
  # without acting on it, which is what makes the contrast measurable.
  arm: C3

  # Files several roles legitimately touch. An exclusive lease means one
  # writer at a time rather than one owner forever.
  contested:
    pyproject.toml: exclusive
    package.json: exclusive
    .github/workflows/ci.yml: exclusive

  budgets:
    # A ceiling on an open-ended agent loop. The failure this prevents is
    # discovering the cost on an invoice rather than at the gate.
    tokens: 400000

evidence:
  sign: true
  verify_on_exit: true
