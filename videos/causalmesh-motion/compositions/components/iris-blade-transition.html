<!doctype html>
<!--
  iris-blade-transition: HyperFrames video primitive (transitions / punctuation)

  Concept: six trapezoidal blades arranged around a shared hexagonal
  aperture, closing to black (or opening from it) as a recurring
  punctuation device between scenes. Built as a mechanical iris rather than
  a plain circle wipe: each blade is one SVG polygon rotated 60deg from the
  last around a common center, and all six travel together so the aperture
  stays hexagonal and centered at every point in the sweep.

  Open and close share one geometry and are matched inverses of each other
  (close: blades sweep in from the frame edge to seal the aperture to zero;
  open: the same six blades sweep back out from sealed to fully retracted),
  so cutting from a close directly into an open of the same size loops
  cleanly with no visible seam.

  Variables (declared in data-composition-variables below):
    - mode (close | open, default close): direction of the sweep.
    - fill (string, default "#050505"): blade color. CausalMesh's stage
      color by default; pass a token var() to theme it.
    - hold (number, seconds, default 0.15): time the sealed (fully closed)
      pose holds before an "open" sweep begins, or after a "close" sweep
      finishes. Lets a cut happen on the black frame without the iris
      motion racing through it.

  Envelope: SWEEP = 0.42s per blade lane, staggered 0.03s so the six blades
  don't all move in lockstep (a hair of rotational asymmetry reads as
  mechanical rather than a single scaled shape). close ends sealed; open
  starts sealed. Total duration is `hold + 6*stagger_tail + sweep`, clamped
  to the mount duration.

  Mount contract: MOUNTABLE SUB-COMPOSITION. The runtime clones only
  <template> contents; #root fills the host box (inset:0, container-type:
  size), and the file registers one paused timeline under the literal
  "iris-blade-transition" key. Variables come from
  window.__hyperframes.getVariables().
-->
<html
  lang="en"
  data-composition-id="iris-blade-transition"
  data-composition-duration="0.9"
  data-composition-variables='[
    { "id": "mode", "type": "enum", "role": "motion", "label": "Mode", "description": "Sweep direction: close seals the aperture to zero, open reveals it from sealed.", "default": "close", "options": [{ "value": "close", "label": "Close" }, { "value": "open", "label": "Open" }] },
    { "id": "fill", "type": "string", "role": "style", "label": "Blade fill", "description": "Color of the six blades.", "default": "#050505" },
    { "id": "hold", "type": "number", "role": "timing", "label": "Hold", "description": "Seconds the sealed pose holds before an open sweep begins, or after a close sweep finishes.", "default": 0.15, "min": 0, "max": 1, "step": 0.01, "unit": "s" }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Iris Blade Transition</title>
  </head>
  <body>
    <template>
      <div id="root" data-composition-id="iris-blade-transition" data-duration="0.9" data-fps="30">
        <style>
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }

          /* Root fills the host-owned box; the aperture is measured in a
             100x100 viewBox so every blade polygon is resolution-independent. */
          #root {
            position: absolute;
            inset: 0;
            container-type: size;
            isolation: isolate;
            overflow: hidden;
            background: transparent;
            pointer-events: none;
          }

          .ibt-clip {
            position: absolute;
            inset: 0;
          }

          .ibt-svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: visible;
          }

          /* Each blade rotates around the shared center (50,50); the
             per-blade transform below only ever changes translate distance
             along its own radial axis, never the rotation, so the hexagon
             stays regular through the whole sweep. */
          .ibt-blade {
            transform-box: view-box;
            transform-origin: 50px 50px;
          }
        </style>

        <div
          id="iris-blade-transition-clip"
          class="ibt-clip clip"
          data-start="0"
          data-duration="0.9"
          data-track-index="0"
        >
          <svg class="ibt-svg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
            <!--
              Six blades: each is a triangle from the frame's outer corner
              region into the shared center, tiled 60deg apart. At rest
              (closed) they overlap fully at the center and read as one
              solid hexagonal cap; retracted (open) they sit clear of the
              100x100 frame. A single "reach" custom property per blade
              (driven by the timeline) interpolates each blade's outer edge
              between "at center" (reach 0) and "off frame" (reach 1),
              which is what makes the aperture read as a hexagon at every
              step rather than a jump-cut circle.
            -->
          </svg>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var svg = root.querySelector(".ibt-svg");
            var NS = "http://www.w3.org/2000/svg";

            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};

            var mode = vars.mode === "open" ? "open" : "close";
            var fill = typeof vars.fill === "string" && vars.fill.trim() !== "" ? vars.fill.trim() : "#050505";
            var rawHold = vars.hold == null ? 0.15 : Number(vars.hold);
            var hold = Number.isFinite(rawHold) ? Math.max(0, Math.min(1, rawHold)) : 0.15;

            // Six blades, 60deg apart, each a kite reaching from the shared
            // center (50,50) out past the frame's diagonal (radius ~85 in
            // the 100x100 viewBox clears every corner). A blade is defined
            // in its own local frame with the reach axis pointing "up"
            // (toward negative y) and is then rotated into place — the
            // rotation is static per blade; only translateY(reach) moves.
            var CX = 50, CY = 50;
            var HALF_WIDTH = 34; // blade half-angle at the center, tuned so six blades fully overlap when sealed
            var REACH = 95; // distance the blade tip travels from sealed to fully retracted

            var blades = [];
            for (var i = 0; i < 6; i++) {
              var angle = i * 60;
              var g = document.createElementNS(NS, "g");
              g.setAttribute("class", "ibt-blade");
              g.setAttribute("id", "ibt-blade-" + i);
              g.setAttribute("transform", "rotate(" + angle + " " + CX + " " + CY + ")");

              var poly = document.createElementNS(NS, "polygon");
              // Local frame before rotation: tip at (CX,CY), base far above
              // (negative y, i.e. "up" before rotation carries it around).
              // The base points are held constant; only the group's own
              // translateY (in local, pre-rotation space) changes per frame,
              // which is why the blade must be a <g> wrapping the polygon
              // rather than the polygon's own points changing every tick.
              var bx = CX - HALF_WIDTH, ax = CX + HALF_WIDTH;
              var tipY = CY;
              var baseY = CY - REACH - 20; // comfortably past the retracted position
              var pts = [
                CX + "," + tipY,
                bx + "," + baseY,
                ax + "," + baseY,
              ].join(" ");
              poly.setAttribute("points", pts);
              poly.setAttribute("fill", fill);
              g.appendChild(poly);
              svg.appendChild(g);
              blades.push(g);
            }

            if (!window.gsap) return;

            var duration = Math.max(0.3, parseFloat(root.dataset.duration || "0.9"));
            var SWEEP = 0.42;
            var STAGGER = 0.03;
            var lastStart = 5 * STAGGER;
            var naturalTotal = hold + lastStart + SWEEP;
            var scale = naturalTotal > duration ? duration / naturalTotal : 1;
            var sweep = SWEEP * scale;
            var stagger = STAGGER * scale;
            var holdT = hold * scale;

            var tl = gsap.timeline({ paused: true });

            // reach 0 == sealed (blade tip at center, covering the frame);
            // reach 1 == fully retracted (blade base clears the frame).
            // "close" runs reach 1 -> 0 (blades sweep IN to seal);
            // "open" runs reach 0 -> 1 (blades sweep OUT to reveal).
            var fromReach = mode === "close" ? 1 : 0;
            var toReach = mode === "close" ? 0 : 1;

            blades.forEach(function (blade, i) {
              var proxy = { r: fromReach };
              var at = mode === "close" ? i * stagger : (holdT + i * stagger);
              function write() {
                // translateY moves the blade's local "up" axis; the group's
                // own rotate() carries that into the correct radial
                // direction for this blade, so the hexagon stays regular.
                blade.setAttribute(
                  "transform",
                  "rotate(" + i * 60 + " " + CX + " " + CY + ") translate(0 " + (-proxy.r * REACH) + ")",
                );
              }
              write();
              tl.to(
                proxy,
                { r: toReach, duration: sweep, ease: "power3.inOut", onUpdate: write },
                at,
              );
            });

            tl.seek(0);

            window.__timelines = window.__timelines || {};
            window.__timelines["iris-blade-transition"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
