name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    # Trusted publishing: PyPI trusts this repo + workflow + environment, so
    # there is no long-lived token. The `pypi` environment must exist under the
    # repository's Settings -> Environments (add required reviewers there).
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install build dependencies
        run: python -m pip install --upgrade pip build twine

      - name: Build package
        run: python -m build

      - name: Check package metadata
        run: twine check --strict dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A version already on PyPI (0.1.0 was uploaded by hand with twine
          # before this workflow could run) is skipped instead of failing the job.
          skip-existing: true
