# Continuous integration.
#
# The suite is the project's central claim: 775 tests covering a signed
# chain, a claim registry that must hold across processes, and a verifier
# that has to detect tampering. A suite nobody runs on a pull request is not
# a safety net, it is a historical record of one machine on one day.
#
# Three properties this workflow is built for:
#
# **It runs on the platforms the code claims to support.** The isolation
# layer behaves differently on Windows (no chroot, documented as a
# limitation), and the TUI's encoding fallbacks exist because a Windows
# console reports cp1252. Testing only on Linux would leave both untested on
# the platform whose behaviour motivated them.
#
# **Lint and format are enforced, not suggested.** They were both failing
# when this file was written: 20 lint errors and 74 unformatted files. A
# check that is optional drifts back to that state.
#
# **The site is built, not assumed.** The landing page and the docs come from
# one Next.js app, and a type error there is as much a broken build as a
# failing test.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets a maintainer re-run the suite without an empty commit.
  workflow_dispatch:

env:
  PIP_DEFAULT_TIMEOUT: "100"
  PIP_RETRIES: "10"

# A new push to the same branch supersedes the run in flight. Without this a
# busy branch queues runs that are already answering a stale question.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Pinned. An unpinned `pip install ruff` installs whatever is newest
      # that morning, so a pull request that changed nothing can fail on a
      # rule that did not exist when it was opened. Bumping this is a commit
      # somebody makes on purpose, with the fixes in the same change.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" "ruff==0.9.6" "mypy==1.14.1"

      - name: Ruff lint
        run: ruff check src tests

      - name: Ruff format
        run: ruff format --check src tests

      # Gating, on the modules that carry the project's guarantees. These
      # are clean under `disallow_untyped_defs` and stay that way: the chain,
      # the claim registry, the gate and the verifier are where a type error
      # would be a correctness error rather than an inconvenience.
      - name: Mypy (enforced)
        run: |
          mypy src/causalmesh/crypto                src/causalmesh/claims                src/causalmesh/events                src/causalmesh/verifier                src/causalmesh/policy                src/causalmesh/hooks

      # Reporting, on everything else. The CLI and the analysis layer predate
      # a strict pass; gating them today would block every pull request on
      # debt unrelated to it. The count only goes down.
      - name: Mypy (whole tree, reporting)
        run: mypy src || true
        continue-on-error: true

  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide the result on the others,
      # which is exactly the information a cross-platform bug needs.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
        # The full grid is six jobs for every push. The middle version on
        # two platforms is the part that catches almost everything; the
        # rest runs on main and on demand.
        exclude:
          - os: macos-latest
            python: "3.11"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,analysis]"

      - name: Unit, property and adversarial tests
        run: pytest -q --ignore=tests/integration

      - name: Integration tests
        # These exercise real subprocesses and real HTTP against a local
        # fake server. Slower, and worth running separately so a failure
        # says which half broke.
        run: pytest -q tests/integration

  evidence:
    name: evidence verifies offline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[analysis]"

      # The project's headline claim, checked on every pull request rather
      # than asserted in the README.
      #
      # The collection is produced here rather than read from the repository,
      # because `data/raw/**` is gitignored: a fresh checkout has no runs in
      # it, so verifying "every chain" would verify nothing and pass. A job
      # that cannot fail is worse than a missing one. This executes four
      # arms against the deterministic mock agent, then verifies what it
      # just produced.
      - name: Produce a collection
        run: causalmesh experiment run --profile smoke --id ci_evidence

      - name: Verify every chain offline
        run: causalmesh verify --id ci_evidence

      - name: Record and audit the manifest
        run: |
          causalmesh manifest write --id ci_evidence
          causalmesh audit --id ci_evidence

      - name: Read the measured contrasts
        run: causalmesh analyze --id ci_evidence

      # The gate decides, and the decision is checked rather than assumed.
      # The contract written here declares an owner, so the two assertions
      # below are a real pair: the owner may write, and nobody else may.
      # `policy check` exits 0 when allowed and 1 when refused, which is
      # what makes this expressible as two shell lines.
      - name: The gate allows an owner and refuses everyone else
        run: |
          cat > /tmp/causalmesh.yaml <<'CONTRACT'
          version: 1
          roles:
            - agent_id: agent_a
              archetype: writer
              owns: [src/causalmesh/policy/]
          policy:
            arm: C3
          CONTRACT
          cp /tmp/causalmesh.yaml ./causalmesh.yaml
          causalmesh policy show --root . --json
          causalmesh policy check --root . --agent agent_a             --kind path --name src/causalmesh/policy/gate.py
          ! causalmesh policy check --root . --agent agent_b             --kind path --name src/causalmesh/policy/gate.py
          rm ./causalmesh.yaml

  security:
    name: security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . "bandit==1.8.0" "pip-audit==2.7.3"

      # Static analysis over the shipped source. Tests are excluded: they
      # assert on things a scanner reads as findings (asserts, subprocess
      # calls into a fake server) and including them would train everyone
      # to ignore the output.
      #
      # This found a real one: the model transport opened any URL urllib
      # had a handler for, so a `file://` base URL from a config would have
      # read a local path and returned it as a model reply.
      - name: Bandit
        run: bandit -r src -ll -ii

      # Known CVEs in the dependency tree. The runtime core is deliberately
      # small, which is most of why this stays quiet.
      - name: Dependency audit
        run: pip-audit --progress-spinner off

  web:
    name: site builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Types
        run: npm run types:check

      - name: Build
        run: npm run build
