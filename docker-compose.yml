# Builds and runs the image against this repository's own causalmesh.yaml
# -- a smoke test for docker/Dockerfile before anyone outside this repo
# uses it. See docs/adoption.md for the shape an operator's own project uses.
services:
  causalmesh:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8420:8420"
    volumes:
      - ./causalmesh.yaml:/app/causalmesh.yaml:ro
    environment:
      # --host 0.0.0.0 (see Dockerfile) is not localhost, so --dev mode is
      # refused; a real token is required. Set it in the shell/CI running
      # `docker compose up`, e.g. `CAUSALMESH_API_TOKEN=... docker compose up`.
      - CAUSALMESH_API_TOKEN=${CAUSALMESH_API_TOKEN}
